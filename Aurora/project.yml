name: Aurora
options:
  bundleIdPrefix: com.werx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    DEAD_CODE_STRIPPING: "YES"
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: Tunnel
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.werx.aurora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        OTHER_LDFLAGS: $(inherited) -lresolv
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Камера нужна, чтобы сканировать QR-коды серверов и подписок.
        NSLocalNetworkUsageDescription: Нужен для локального прокси и проверки серверов.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы прочитать QR-код с картинки.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.werx.aurora.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.werx.aurora
            CFBundleURLSchemes:
              - aurora
              - happ
              - v2raytun
              - vless
              - vmess
              - trojan
              - ss
              - hysteria2
              - hy2
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - path: Shared
        excludes:
          - "**/.gitkeep"
    dependencies:
      - framework: Frameworks/Corebridge.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.werx.aurora.tunnel
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        OTHER_LDFLAGS: $(inherited) -lresolv
        APPLICATION_EXTENSION_API_ONLY: "YES"
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Aurora Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
