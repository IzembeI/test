name: Build IPA
on:
  push:
    paths-ignore:
      - 'preview/**'
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AutoTyper.xcodeproj -scheme AutoTyper -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | tee build.log | grep -E "error|BUILD (SUCCEEDED|FAILED)" || { tail -n 80 build.log; exit 1; }
          grep -q "BUILD SUCCEEDED" build.log
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/AutoTyper.app
          codesign -f -s - --entitlements Keyboard/Keyboard.entitlements "$APP/PlugIns/Keyboard.appex"
          codesign -f -s - --entitlements App/App.entitlements "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Mercury.ipa Payload
          ls -lh Mercury.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Mercury-ipa
          path: Mercury.ipa
